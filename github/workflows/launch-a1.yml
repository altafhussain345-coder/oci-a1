name: Launch OCI A1

# GitHub cron can't run more often than every 5 minutes (and it is often late),
# so the 90-second retry loop lives INSIDE one long job (launch-a1.sh).
# Each job runs ~5h45m (the limit is 6h); the cron below just keeps the next run queued
# behind it, and `concurrency` makes sure only one run is active at a time.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: oci-a1-launcher
  cancel-in-progress: false

permissions:
  actions: write   # lets the script disable this workflow once the VM exists

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and configure the OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          pip install --quiet oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Retry launching every 90 seconds
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          # ---- success alerts (all optional; leave a secret undefined to skip) ----
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          # ---- tweak these if you like ----
          INSTANCE_NAME: a1-free
          OCPUS: "2"                       # Always Free A1 = 2 OCPUs / 12 GB in total (June 2026 docs)
          MEMORY_GB: "12"
          BOOT_VOLUME_GB: "100"
          RETRY_SECONDS: "90"
          RUN_MINUTES: "345"
          GATE_ON_CAPACITY_REPORT: "false"  # "true" = skip launch calls while the report says no capacity
        run: bash launch-a1.sh
